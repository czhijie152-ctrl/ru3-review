<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大学俄语3 · 复习工具</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1c1f26; --dim:#6b7280; --line:#e3e6ea;
    --accent:#2563eb; --good:#16a34a; --bad:#dc2626; --warn:#d97706;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;
         position:sticky;top:0;z-index:10;}
  h1{margin:0;font-size:19px;letter-spacing:.3px}
  h1 small{font-weight:400;color:var(--dim);font-size:13px;margin-left:8px}
  nav{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  nav button{border:1px solid var(--line);background:#fff;color:var(--ink);
             padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px}
  nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{max-width:860px;margin:0 auto;padding:18px}
  .panel{display:none} .panel.on{display:block}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .bar label{font-size:13px;color:var(--dim)}
  select,input[type=search]{padding:7px 10px;border:1px solid var(--line);
        border-radius:8px;background:#fff;font-size:14px;color:var(--ink)}
  input[type=search]{flex:1;min-width:140px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
        min-height:290px;display:flex;flex-direction:column;align-items:center;
        justify-content:center;padding:28px 20px;text-align:center;cursor:pointer;
        box-shadow:0 1px 3px rgba(0,0,0,.04);transition:transform .12s}
  .card:active{transform:scale(.995)}
  .word{font-size:40px;font-weight:600;line-height:1.25;word-break:break-word}
  .word.zh{font-size:30px}
  .sub{margin-top:10px;color:var(--dim);font-size:14px}
  .answer{margin-top:18px;font-size:24px;line-height:1.5;
          border-top:1px dashed var(--line);padding-top:16px;width:100%}
  .answer .pos{font-size:14px;color:var(--accent);margin-right:8px}
  .answer .note{display:block;font-size:14px;color:var(--dim);margin-top:6px}
  .hint{color:var(--dim);font-size:14px}
  .speak{border:none;background:#eef2ff;color:var(--accent);border-radius:8px;
         padding:6px 12px;margin-top:14px;cursor:pointer;font-size:14px}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .actions button{border:none;border-radius:10px;padding:11px 22px;font-size:15px;
        cursor:pointer;color:#fff;background:var(--accent)}
  .actions .bad{background:var(--bad)} .actions .good{background:var(--good)}
  .actions .ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .stats{display:flex;gap:16px;justify-content:center;color:var(--dim);
         font-size:13px;margin-top:16px;flex-wrap:wrap}
  .stats b{color:var(--ink)}

  ul.words{list-style:none;padding:0;margin:0}
  ul.words li{background:#fff;border:1px solid var(--line);border-radius:12px;
      padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:baseline}
  ul.words .ru{font-weight:600;font-size:18px;min-width:180px;flex-shrink:0}
  ul.words .zh{color:var(--ink)}
  ul.words .pos{font-size:12px;color:var(--accent);border:1px solid #dbeafe;
      background:#eff6ff;border-radius:6px;padding:1px 6px;margin-left:6px}
  ul.words .tag{font-size:12px;color:var(--dim);margin-left:6px}
  ul.words .note{display:block;color:var(--dim);font-size:13px;margin-top:3px}

  .gram h3{margin:26px 0 8px;font-size:17px}
  .gram h3:first-child{margin-top:0}
  .gram p{margin:8px 0}
  .gram table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;
      background:#fff;border-radius:10px;overflow:hidden}
  .gram th,.gram td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  .gram th{background:#f0f2f5;font-weight:600}
  .gram .rule{background:#fffbeb;border-left:3px solid var(--warn);
      padding:10px 12px;border-radius:8px;margin:10px 0}
  .gram .namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
  .gram .namegrid div{background:#fff;border:1px solid var(--line);
      border-radius:8px;padding:6px 10px;font-size:14px}
  .gram .namegrid span{color:var(--dim);font-size:13px}
  .note-src{color:var(--dim);font-size:13px;margin-top:26px;
      border-top:1px solid var(--line);padding-top:12px}
  .gmode{border:1px solid var(--line);background:#fff;color:var(--ink);
      padding:7px 16px;border-radius:999px;cursor:pointer;font-size:14px}
  .gmode.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .qbox{background:#fff;border:1px solid var(--line);border-radius:16px;
      padding:26px 20px;text-align:center}
  .qbox .qtext{font-size:24px;line-height:1.5;font-weight:600}
  .qbox .qmeta{color:var(--dim);font-size:13px;margin-top:10px}
  .options{display:grid;gap:10px;margin-top:14px}
  .options button{text-align:left;padding:13px 16px;border-radius:12px;
      border:1px solid var(--line);background:#fff;font-size:17px;cursor:pointer;
      transition:.12s;font-family:inherit}
  .options button:hover:not(:disabled){border-color:var(--accent)}
  .options button.right{background:#ecfdf5;border-color:var(--good);color:#065f46;font-weight:600}
  .options button.wrong{background:#fef2f2;border-color:var(--bad);color:#991b1b}
  .options button:disabled{cursor:default}
  .qfb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px;line-height:1.6}
  .qfb.ok{background:#ecfdf5;color:#065f46;border-left:3px solid var(--good)}
  .qfb.no{background:#fef2f2;color:#991b1b;border-left:3px solid var(--bad)}
  #type-area{width:100%;max-width:440px;margin-top:16px}
  #type-input{width:100%;padding:14px 16px;font-size:22px;border:2px solid var(--line);
      border-radius:12px;text-align:center;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
  #type-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #dbeafe}
  #type-input:disabled{background:#f9fafb;opacity:1}
  @media(max-width:600px){
    .word{font-size:32px} .answer{font-size:20px}
    ul.words li{flex-direction:column;gap:4px}
    ul.words .ru{min-width:0}
  }
</style>
</head>
<body>
<header>
  <h1>大学俄语3 · 复习工具</h1>
  <div class="bar" style="margin:10px 0 0">
    <label>课次</label><select id="sel-lesson"></select>
    <span id="booktitle" style="color:var(--dim);font-size:14px"></span>
  </div>
  <nav>
    <button id="tab-cards" class="on">背单词</button>
    <button id="tab-list">词汇表</button>
    <button id="tab-gram">语法</button>
  </nav>
</header>
<main>
  <section id="panel-cards" class="panel on">
    <div class="bar">
      <label>范围</label><select id="sel-group"></select>
      <label>方向</label><select id="sel-dir">
        <option value="ru2zh">俄语 → 中文</option>
        <option value="zh2ru">中文 → 俄语（看答案）</option>
        <option value="zh2type">中文 → 俄语（默写）</option>
      </select>
      <button class="ghost" id="btn-shuffle" style="border:1px solid var(--line);background:#fff;
        border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px">乱序</button>
      <button class="ghost" id="btn-wrong" style="border:1px solid var(--line);background:#fff;
        border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px">只背错词</button>
    </div>
    <div class="card" id="card">
      <div class="word" id="card-front">—</div>
      <div class="sub" id="card-sub"></div>
      <div id="type-area" style="display:none">
        <input type="text" id="type-input" placeholder="在这里输入俄语…" autocomplete="off"
               autocapitalize="off" spellcheck="false" lang="ru">
        <div class="hint" style="margin-top:8px">不用输入重音符号；词组按空格输入</div>
      </div>
      <div class="answer" id="card-answer" style="display:none"></div>
      <button class="speak" id="btn-speak">🔊 朗读</button>
      <div class="hint" id="card-hint" style="margin-top:12px">点击卡片或按空格翻转</div>
    </div>
    <div class="actions">
      <button class="bad" id="btn-bad">不认识</button>
      <button class="ghost" id="btn-prev">上一个</button>
      <button class="good" id="btn-good">认识</button>
    </div>
    <div class="stats">
      <span>进度 <b id="st-pos">0/0</b></span>
      <span>本轮已答 <b id="st-done">0</b></span>
      <span>正确率 <b id="st-acc">—</b></span>
      <span>错词本 <b id="st-wrong">0</b></span>
      <span style="cursor:pointer;text-decoration:underline" id="btn-reset">重置进度</span>
    </div>
  </section>

  <section id="panel-list" class="panel">
    <div class="bar">
      <input type="search" id="q" placeholder="搜索俄语或中文…">
      <label>范围</label><select id="sel-group2"></select>
    </div>
    <ul class="words" id="wordlist"></ul>
  </section>

  <section id="panel-gram" class="panel">
    <div class="bar">
      <button class="gmode on" id="gm-ref">📖 规则速查</button>
      <button class="gmode" id="gm-quiz">✍️ 语法练习</button>
    </div>
    <div class="gram" id="grambody"></div>
    <div id="quizbody" style="display:none"></div>
  </section>
</main>

ришли́ домо́й о́коло оди́ннадцати.", "「我们是 11 点左右回到家的。」"], ["— Почему́ вы так по́здно верну́лись из теа́тра?", "「为什么你们这么晚才从剧院回来？」"], ["— Мы заходи́ли по́сле теа́тра к друзья́м.", "「我们看完戏顺便去了朋友们那里。」"]]}}]}, {"id": "v-vy", "title": "三、в- 与 вы-", "points": ["带前缀 **в-** 的运动动词表示**从外向里**的运动，经常连用的前置词有 в, на, к。", "带前缀 **вы-** 的运动动词表示**从里向外**的运动，经常连用的前置词有 из, с, от。", "例句：Преподава́тель вошёл в аудито́рию.（老师走进教室。）", "例句：Мать вы́шла из ку́хни.（母亲从厨房走了出来。）", "带前缀 **вы-** 的运动动词（вы́йти, вы́ехать, вы́лететь 等）还可表示「**出发**」「动身」的意义：", "　Он рабо́тает далеко́ и ка́ждый день и́з дому выхо́дит ра́но.（他在很远的地方工作，每天早早从家里出来。）", "　Я вылета́ю за́втра у́тром.（我明早乘飞机走。）"], "cases": [{"rule": "**в-（进）与 вы-（出）的搭配对照**", "table": {"headers": ["进（в-）", "出（вы-）"], "rows": [["войти́ в дом", "вы́йти из до́ма"], ["войти́ на стадио́н", "вы́йти со стадио́на"], ["войти́ к дека́ну", "вы́йти от дека́на"]]}}, {"rule": "**вы- 与前置词 в 连用**时，表示行为主体从一个空间出来后**来到另一个空间**，其语义与带前缀 в- 的运动动词语义相反。试比较：", "table": {"headers": ["句子", "译文"], "rows": [["Мы вошли́ в сад.", "我们走进了花园。（在此之前我们在街上。）"], ["Мы вы́шли в сад.", "我们出来到了花园里。（在此之前我们在屋子里。）"]]}}, {"rule": "**вы́йти 与 уйти́**：вы́йти 的过去时可表示**在短时间内可能回来**，而 уйти́ 没有这个意思，只是指「离开某一地方」。试比较：", "table": {"headers": ["对话", "译文"], "rows": [["— Где же Ка́тя?", "「卡佳在哪儿呀？」"], ["— Она́ вы́шла. Ско́ро вернётся.", "「她出去了，很快就会回来。」"]]}}, {"rule": "**войти́ 与 прийти́**：войти́ 表示主体**从外向里**的运动，指进到某一空间；прийти́ 指主体**来到某处**，着眼于抵达终点、目的地。试比较：", "table": {"headers": ["句子", "译文"], "rows": [["Ка́ждый день он прихо́дит в институ́т во́время.", "每天他都准时到校。"], ["В ко́мнату кто́-то вошёл.", "有人进了房间。"]]}}]}, {"id": "ot-pod-do", "title": "四、от-、под-、до-", "points": ["**от-**：表示「从某处离开（一段距离）」或「（退离）到某处」，分别与前置词 **от, к**（в, на）连用。", "　Нúна отошла́ от окна́ и се́ла к столу́.（尼娜离开窗户，坐到桌旁。）", "　Я отошёл к окну́, что́бы не меша́ть занима́ться.（我退到窗户跟前，以便不影响他们学习。）", "**под-**：表示「**走近**某处」，常与前置词 **к** 连用。", "　Больнóй подошёл к окну́, что́бы закры́ть его́.（病人走到窗户跟前把它关上。）", "**до-**：表示**到达某一地点**的运动，与前置词 **до** 连用。", "　Мы дошли́ до ста́нции.（我们到了车站。）"], "cases": [{"rule": "**от- 的补充说明**：带前缀 от- 的运动动词（отходи́ть, отплыва́ть 等）可表示**车、船离开**的意义，但表示**飞机离开**时，使用 **вылета́ть**。", "table": {"headers": ["例句", "译文"], "rows": [["Мой по́езд отхо́дит в 16.40 с Пеки́нского вокза́ла.", "我乘坐的火车 16 点 40 分从北京站开出。"], ["Мой самолёт вылета́ет из Москвы́ в три часа́ дня.", "我的飞机下午 3 点从莫斯科起飞。"]]}}]}, {"id": "pere-pro-po", "title": "五、пере-、про-、по-", "points": ["**пере-**：表示「越过某处」时，后面接前置词 **че́рез** 或直接接第四格名词；表示「从一个地方到另一个地方的运动」时，使用「**откуда → куда**」的结构。", "　Мы перее́хали (че́рез) мост.（我们乘车过了桥。）", "　Студе́нты перее́хали в но́вое общежи́тие.（大学生们搬进了新宿舍。）", "**про-** 的主要语义及接格关系：", "　(1) 表示**穿过、通过某地**的运动，常接前置词 че́рез 或直接与第四格补语连用：Мы прошли́ всю у́лицу.（我们走过整条街道。）／Маши́на прое́хала че́рез лес и вы́ехала на шоссе́.（汽车穿过森林，驶到公路上。）", "　(2) 表示**从某物或某人旁边经过**的运动，与前置词 **ми́мо** 连用：Я никогда́ не был на э́той у́лице, поэ́тому прошёл ми́мо ну́жного мне до́ма.（我从来没去过这条街道，因此错过了我要找的房子。）", "　(3) 表示**经过一段距离**的运动，常接第四格补语：Я прошёл два киломе́тра за 20 мину́т.（我 20 分钟走了两公里。）", "**по-**：идти́, е́хать 等加前缀 по- 后构成**单体动词** пойти́, пое́хать 等，它们的使用特点如下：", "　(1) 用来表示**运动的开始**：А́нна поза́втракала и пошла́ на заня́тия.（安娜吃完早饭就去上课了。）", "　(2) **将来时形式**表示「打算去」「想去」：Куда́ вы пойдёте по́сле уро́ка?（下课后您要去哪儿？）", "　(3) 过去时 **пошёл, пое́хал** 表示行为已经开始，指说话时刻某人已经前往某处：— Где оте́ц? — Оте́ц пошёл на рабо́ту.（「父亲在哪儿？」「他去上班了。」）"]}, {"id": "aspect-usage", "title": "六、带前缀运动动词体的用法", "points": ["不同体的带前缀运动动词有不同的意义和用法。"], "cases": [{"rule": "**1）完成体动词**", "table": {"headers": ["用法", "例句", "译文"], "rows": [["(1) 过去时表示带有**结果意义的一次具体运动**", "Он пришёл к нам в го́сти и привёл свою́ подру́гу.", "他来我们这儿做客，还带来了女友。"], ["(2) 被否定表示该行为是**所期待的、应发生但未发生**", "Ребя́та до́лго жда́ли учи́теля. Но учи́тель не пришёл.", "同学们等老师等了好久，可是老师没来。"]]}}, {"rule": "**2）未完成体动词**", "table": {"headers": ["用法", "例句", "译文"], "rows": [["(1) 表示**经常发生**的行为", "В Пеки́н ка́ждый день прилета́ют иностра́нные го́сти.", "每天有很多外国客人乘飞机来北京。"], ["(2) 过去时表示**一次往返**的行为", "К тебе́ приходи́ли.", "有人来找过你。"], ["(3) 具有「来到、离开」意义的带前缀运动动词，**现在时**可表示即将发生的行为", "Мы уезжа́ем че́рез неде́лю.", "一周后我们就要离开了。"], ["(4) 过去时和将来时可表示**时间关系**", "Когда́ он уходи́л, он проси́л переда́ть тебе́ э́ту запи́ску.／Когда́ бу́дете уходи́ть, прове́рьте, закры́ты ли о́кна.", "他走的时候，请求把这个字条交给你。／你们要离开的时候，检查一下窗户是否已经关上了。"], ["(5) 被否定表示该行为**从未发生**或持续时间内没有发生", "Он никогда́ не приноси́л цвето́в.", "他从没给我送过花儿。"]]}}]}], "quiz": [{"cat": "при-/у-", "q": "Подру́га ___ ко мне по́сле обе́да.", "options": ["пришла́", "ушла́", "вы́шла", "дошла́"], "answer": 0, "explain": "при- 表示「来到某处」，来到「我这儿」用 пришла́。"}, {"cat": "при-/у-", "q": "Подру́га ___ от меня́ по́здно.", "options": ["пришла́", "ушла́", "вошла́", "перешла́"], "answer": 1, "explain": "у- 表示「从某处离开」，от меня́ 搭配 ушла́。"}, {"cat": "при-/у-", "q": "Он ___ из шко́лы домо́й.", "options": ["пришёл", "ушёл", "вошёл", "дошёл"], "answer": 1, "explain": "从学校离开用 ушёл（уйти́ из шко́лы）。"}, {"cat": "при-/у-", "q": "Он ___ на рабо́ту в 8 часо́в утра́.", "options": ["пришёл", "ушёл", "вы́шел", "отошёл"], "answer": 1, "explain": "去上班（离开家）用 ушёл。"}, {"cat": "при-/у-", "q": "Ка́ждый день он ___ в институ́т во́время.", "options": ["прихо́дит", "ухо́дит", "вхо́дит", "отхо́дит"], "answer": 0, "explain": "来到某处（着眼抵达终点）用 приходи́т。"}, {"cat": "при-/у-", "q": "「顺便去朋友家」应该用哪个动词？", "options": ["прийти́ к дру́гу", "зайти́ к дру́гу", "уйти́ к дру́гу", "дойти́ к дру́гу"], "answer": 1, "explain": "зайти́ 表示顺路、顺便到某处；прийти́ 没有这个意思。"}, {"cat": "в-/вы-", "q": "Преподава́тель ___ в аудито́рию.", "options": ["вошёл", "вы́шел", "пришёл", "отошёл"], "answer": 0, "explain": "в- 表示从外向里进入，в аудито́рию 搭配 вошёл。"}, {"cat": "в-/вы-", "q": "Мать ___ из ку́хни.", "options": ["вошла́", "вы́шла", "пришла́", "дошла́"], "answer": 1, "explain": "вы- 表示从里向外，из ку́хни 搭配 вы́шла。"}, {"cat": "в-/вы-", "q": "Мы вошли́ в сад. 这句话的意思是：", "options": ["我们出来到了花园里", "我们走进了花园", "我们离开了花园", "我们到了花园附近"], "answer": 1, "explain": "в- 表示从外向里，вошли́ в сад = 走进花园（此前在街上）。"}, {"cat": "в-/вы-", "q": "Мы ___ в сад.（此前我们在屋子里，出来到了花园）", "options": ["вошли́", "вы́шли", "ушли́", "пришли́"], "answer": 1, "explain": "вы́йти в сад 表示从屋里出来到花园，语义与 войти́ 相反。"}, {"cat": "в-/вы-", "q": "— Где же Ка́тя? — Она́ ___. Ско́ро вернётся.（强调短时间内会回来）", "options": ["ушла́", "вы́шла", "пришла́", "перешла́"], "answer": 1, "explain": "вы́йти 的过去时可表示短时间内可能回来；уйти́ 只指「离开」。"}, {"cat": "в-/вы-", "q": "「有人进了房间」应说：", "options": ["В ко́мнату кто́-то вошёл.", "В ко́мнату кто́-то пришёл.", "Из ко́мнаты кто́-то вы́шел.", "К ко́мнате кто́-то подошёл."], "answer": 0, "explain": "войти́ 指从外向里进入某一空间。"}, {"cat": "в-/вы-", "q": "Я ___ за́втра у́тром.（我明早乘飞机走）", "options": ["влета́ю", "вылета́ю", "улета́ю", "прилета́ю"], "answer": 1, "explain": "вы́лететь / вылета́ть 表示「出发、动身」。"}, {"cat": "от-/под-/до-", "q": "Нúна ___ от окна́ и се́ла к столу́.", "options": ["подошла́", "отошла́", "дошла́", "ушла́"], "answer": 1, "explain": "от- 表示从某处离开一段距离，от окна́ 搭配 отошла́。"}, {"cat": "от-/под-/до-", "q": "Больнóй ___ к окну́, что́бы закры́ть его́.", "options": ["отошёл", "подошёл", "дошёл", "вошёл"], "answer": 1, "explain": "под- 表示走近某处，к окну́ 搭配 подошёл。"}, {"cat": "от-/под-/до-", "q": "Мы ___ до ста́нции.", "options": ["подошли́", "дошли́", "ушли́", "перешли́"], "answer": 1, "explain": "до- 表示到达某地点，до ста́нции 搭配 дошли́。"}, {"cat": "от-/под-/до-", "q": "Мой по́езд ___ в 16.40 с Пеки́нского вокза́ла.", "options": ["отхо́дит", "подхо́дит", "дохо́дит", "вхо́дит"], "answer": 0, "explain": "车、船离开用 отходи́ть。"}, {"cat": "от-/под-/до-", "q": "表示飞机起飞离开，应该用：", "options": ["отлета́ть", "вылета́ть", "подлета́ть", "долета́ть"], "answer": 1, "explain": "教材指出：表示飞机离开时使用 вылета́ть。"}, {"cat": "пере-/про-/по-", "q": "Мы ___ (че́рез) мост.", "options": ["перее́хали", "прое́хали", "дое́хали", "уе́хали"], "answer": 0, "explain": "пере- 表示越过某处，接 че́рез 或第四格。"}, {"cat": "пере-/про-/по-", "q": "Мы ___ всю у́лицу.", "options": ["перешли́", "прошли́", "дошли́", "вы́шли"], "answer": 1, "explain": "про- 表示穿过、通过某地，直接接第四格。"}, {"cat": "пере-/про-/по-", "q": "Я никогда́ не был на ": {"headers": ["带 -ся 动词", "词义"], "rows": [["встреча́ться", "相遇（Мы с э́той де́вушкой где-то встреча́лись.）"], ["знако́миться", "相识（Я познако́мился с бра́том дру́га.）"], ["расстава́ться", "分手"], ["сове́товаться", "商量"], ["обнима́ться", "拥抱"], ["ви́деться", "见面"], ["объединя́ться", "联合"], ["проща́ться", "告别"], ["перепи́сываться", "通信"], ["целова́ться", "亲吻"]]}}, {"rule": "**3）表示被动意义**：", "table": {"headers": ["带 -ся 动词", "词义"], "rows": [["обсужда́ться", "讨论"], ["выполня́ться", "完成"], ["стро́иться", "建设"], ["писа́ться", "写"]]}}]}, {"id": "negative-ni", "title": "二、否定代词和否定副词（1）带 ни- 的", "points": ["否定代词（отрица́тельное местоиме́ние）**никто́, ничто́** 是由疑问代词加 **ни-** 构成，表示「无论……都（不）」的意义，变格与疑问代词相同。", "带 **ни-** 的否定代词**只用于否定句**中。否定代词与前置词连用时，**前置词置于 ни 和疑问代词之间**。例如：", "　Я ничего́ не купи́л.（我什么都没买。）", "　Ничья́ по́мощь не нужна́.（不需要任何人的帮助。）", "　Ни у кого́ нет э́той кни́ги.（谁都没有这本书。）", "带 ни- 的否定副词（отрица́тельное наре́чие）**никогда́, никуда́** 等，与带 ни- 的否定代词一样，用于否定句中。例如：", "　Я никогда́ не был в Росси́и.（我从来没去过俄罗斯。）", "　Мы никуда́ не е́здили в воскресе́нье.（我们周日哪儿都没去。）"], "cases": [{"rule": "**[注] 肯定句与否定句的对应**：肯定句中用 **все, всегда́, везде́** 等含概括意义的词表示的句子成分，在相应的否定句中一般用 **никто́, ничто́, никогда́, никуда́** 来表示。试比较：", "table": {"headers": ["肯定句", "否定句"], "rows": [["Все сда́ли экза́мены.（所有的人都通过了考试。）", "Никто́ не сдал экза́мены.（谁都没通过考试。）"], ["Он всегда́ говори́т пра́вду.（他总是说实话。）", "Он никогда́ не говори́т пра́вду.（他从来不讲话。）"]]}}]}, {"id": "negative-ne", "title": "三、否定代词和否定副词（2）带 не- 的", "points": ["否定代词 **не́кого, не́чего** 由疑问代词 кто, что 的**第二格**加 **не-** 构成，它们**没有第一格**的形式，各格形式与疑问代词的变化相同，**重音在 не- 上**。与前置词连用时，前置词置于 не 和疑问代词之间。", "否定代词 не́кому, не́чего 只与**动词不定式**连用，构成一种特殊的**否定无人称句**，表示行为由于缺少主体或客体而无法进行，意思是「没有……可（能）」。句中主体用**第三格**形式。谓语的过去时、将来时分别用 **бы́ло, бу́дет** 表示。例如：", "　Мне не́чего вам рассказа́ть.（我没什么给您讲的。）", "　Мне не́кого бы́ло спра́шивать.（当时我没有人可以询问。）", "　Он ничего́ не де́лает, потому́ что ему́ не́чего бу́дет де́лать.（他什么都不会做的，因为他将无事可做。）", "否定副词 **не́когда, не́куда, не́где** 等与带 не- 的否定代词一样，**只用于无人称句**中，用法相同。例如：", "　Нам не́где бы́ло сиде́ть: все места́ бы́ли за́няты.（我们无处可坐，因为所有的座位都坐满了。）", "　Здесь не́куда поста́вить чемода́н.（这里没地儿可以放箱子。）", "　Нам не́когда бу́дет ещё раз встре́титься.（我们没有时间能再会面了。）"], "cases": [{"rule": "**[注] 与带 не- 的无人称句相应的肯定句模式**是「**кому есть (бы́ло, бу́дет) + 疑问代词或疑问副词 + 动词不定式**」，意思是「有……可……」。表示现在时语义时使用 **есть**，过去时使用 **бы́ло**，将来时使用 **бу́дет**。例如：", "table": {"headers": ["否定（没有……可）", "肯定（有……可）"], "rows": [["Ему́ не́чего (бы́ло, бу́дет) сказа́ть.", "Ему́ есть (бы́ло, бу́дет) что сказа́ть.（他有得说。）"], ["Мне не́куда (бы́ло, бу́дет) пойти́.", "Мне есть (бы́ло, бу́дет) куда́ пойти́.（我有地方可去。）"]]}}]}], "quiz": [{"cat": "-ся 动词", "q": "Мы́ться 属于哪一类 -ся 动词？", "options": ["反身意义（-ся = себя）", "相互意义（-ся = друг друга）", "被动意义", "无意义"], "answer": 0, "explain": "мы́ться 表示行为及于主体本身，-ся 有 себя 的意思。"}, {"cat": "-ся 动词", "q": "«Ня́ня мо́ет ребёнка» 改成「保姆在洗澡」应该说：", "options": ["Ня́ня мо́ется.", "Ня́ня мо́ет.", "Ня́ня мо́ет себя́ ребёнка.", "Ня́ня умыва́ется."], "answer": 0, "explain": "мы́ться 表示主体给自己洗澡。"}, {"cat": "-ся 动词", "q": "«Мать одева́ет сы́на»（母亲给儿子穿衣服）换成「母亲在穿衣服」：", "options": ["Мать одева́ется.", "Мать одева́ет.", "Мать раздева́ется.", "Мать одева́ет себя́ сы́на."], "answer": 0, "explain": "одева́ться 表示给自己穿衣服。"}, {"cat": "-ся 动词", "q": "встреча́ться, знако́миться, проща́ться 属于哪一类？", "options": ["反身意义", "相互意义", "被动意义", "使役意义"], "answer": 1, "explain": "这些词表示两个或几个人的相互行为，-ся = друг друга。"}, {"cat": "-ся 动词", "q": "«Я познако́мился с бра́том дру́га» 中为什么要用 с кем 结构？", "options": ["因为主语是复数", "因为主语是单数，相互行为需加 с кем", "因为是被动句", "因为是口语"], "answer": 1, "explain": "相互意义动词主语一般用复数；用单数时须加 с кем 的结构。"}, {"cat": "-ся 动词", "q": "обсужда́ться, выполня́ться, стро́иться 属于哪一类？", "options": ["反身意义", "相互意义", "被动意义", "无人称意义"], "answer": 2, "explain": "这三类中它们是表示被动意义的 -ся 动词。"}, {"cat": "-ся 动词", "q": "「我在哪儿见过这个女孩儿」应该用：", "options": ["Я встре́тил э́ту де́вушку.", "Мы с э́той де́вушкой где́-то встреча́лись.", "Я встреча́юсь э́ту де́вушку.", "Э́т ns", "title": "一、不定代词和不定副词（1）带 -нибудь（-либо）的", "points": ["**不定代词**（неопределённое местоиме́ние）由疑问代词加 **-то, -нибудь（-либо）, кое-** 构成；**不定副词**（неопределённое наре́чие）由疑问副词加同样成分构成。不定代词的变格与构成它们的疑问代词相同。", "带 **-нибудь** 的不定代词有 кто́-нибудь, что́-нибудь, како́й-нибудь, че́й-нибудь；不定副词有 где́-нибудь, отку́да-нибудь, куда́-нибудь, когда́-нибудь 等。", "带 -нибудь 的不定代词和不定副词表示**说话人不能肯定的**、或**说话人自己也不知道是否存在**的人、物、特征、属性、时间和地点等，意思是「任何……」「随便……」「无论……」。", "这类词常用于表示**祈使、疑问或条件**意义的句子中。例如：", "　Расскажи́ что́-нибудь о свое́й студе́нческой жи́зни.（讲点儿你在学院生活的事儿吧。）", "　Вы с ним когда́-нибудь встреча́лись?（您和他什么时候见过面吗？）", "　Е́сли кто́-нибудь придёт, позови́те меня́.（要是有人来，就叫我一下吧。）", "**[注]** 带 **-либо** 的不定代词和不定副词与带 -нибудь 的意义相同，只是前者多用于**书面语**中。"]}, {"id": "indefinite-to", "title": "二、不定代词和不定副词（2）带 -то 的", "points": ["带 **-то** 的不定代词有 кто́-то, что́-то, како́й-то；不定副词有 где́-то, отку́да-то, куда́-то, когда́-то 等。", "这类词表示**说话人知道有**某人、物、特征、属性、时间、地点等，但却**知道得不具体、不确切，无法明确指出**，意思是「不知是……」。例如：", "　Са́ша ждёт кого́-то у вхо́да.（萨沙在入口处等什么人。）", "　Чья́-то кни́га лежи́т на столе́.（不知是谁的书放在桌子上。）", "　Пе́ти нет до́ма: он куда́-то ушёл.（彼佳没在家，不知上哪儿去了。）"], "cases": [{"rule": "**-нибудь 与 -то 的区别**：-нибудь 指说话人**不知道是否存在**（任何、随便哪一个）；-то 指说话人**知道存在但说不清是哪一个**（不知是哪一个）。", "table": {"headers": ["形式", "含义", "例"], "rows": [["кто́-нибудь", "任何人（不知有没有）", "Е́сли кто́-нибудь придёт…（要是有人来……）"], ["кто́-то", "某人（知道有，但不知是谁）", "Са́ша ждёт кого́-то.（萨沙在等什么人。）"]]}}]}, {"id": "indefinite-koe", "title": "三、不定代词和不定副词（3）带 кое- 的", "points": ["带 **кое-** 的不定代词有 ко́е-кто, ко́е-что, ко́е-како́й；不定副词有 ко́е-где, ко́е-когда́ 等。", "不定代词与前置词连用时，**前置词置于 кое- 与疑问代词之间**。", "带 кое- 的不定代词和不定副词表示说话人**确知存在，但因故不明说**的人、物、特征、时间和地点，具有「某……」之意。例如：", "　Ко́е у кого́ я уже́ спра́шивал об э́том, но никто́ ничего́ не знал.（这件事我已向一些人打听过了，但谁也不知道。）", "　Ко́е-како́го материа́ла у нас ещё не хвата́ет.（我们还缺某些材料。）", "　Мне ну́жно ко́е-куда́ сходи́ть.（我要到某个地方去一趟。）", "带 кое- 的不定代词有时在意义上接近 **не́которые**，例如：", "　Ко́е-кто из студе́нтов вы́шел из аудито́рии. ≈ Не́которые студе́нты вы́шли из аудито́рии."]}, {"id": "direct-speech", "title": "四、直接引语和间接引语（1）定义与标点", "points": ["引用别人的话有两种方法：**直接引语**（пряма́я речь）和**间接引语**（ко́свенная речь）。", "**直接引语**：对别人的话所作的**一字不改**的转述，书写时放在**引号**之中。例如：Са́ша сказа́л: «Я за́втра в командиро́вку».（萨沙说：「我明天就要去出差。」）", "**间接引语**：对别人的话，以**引用者的口吻**所作的转述。例如：Са́ша сказа́л, что он за́втра е́дет в командиро́вку.（萨沙说他明天就要去出差。）"], "cases": [{"rule": "**1）直接引语位于引用者的话之后**：其前标**冒号**，直接引语的第一个字母**大写**。如直接引语为陈述句，句末使用句号，放在引号**外**；如为疑问句或感叹句，句末使用问号或惊叹号，放在引号**内**。", "table": {"headers": ["例句", "译文"], "rows": [["А́нна Ива́новна говори́т: «Познако́мьтесь, э́то мой муж».", "安娜·伊万诺芙娜说：「请认识一下，这是我丈夫。」"], ["Она́ спроси́ла меня́: «Что с тобо́й случи́лось?»", "她问我：「你怎么了？」"]]}}, {"rule": "**2）直接引语位于引用者的话之前**：两者之间使用**破折号**连接。引用者的话用**倒装词序**（谓语在先，主语在后）。如直接引语为陈述句，句末标逗号，放在引号**外**；如为疑问句或感叹句，句末标问号或惊叹号，放在引号**内**。", "table": {"headers": ["例句", "译文"], "rows": [["«Сего́дня у нас авто́бусная экску́рсия по истори́ческим места́м го́рода», — объясня́л тури́стам за за́втраком.", "「今天我们将乘大巴游览城市古迹，」吃早饭时导游对游客们说。"], ["«По како́му телекана́лу бу́дут пока́зывать футбо́льный матч?» — поинтересова́лся оте́ц.", "「哪个频道播足球赛？」父亲问。"]]}}, {"rule": "**3）引用者的话位于直接引语之中**：引用者的话用倒装词序，**前后都标破折号**。· 若前半部分**不是完整句子**：其后及引用者的话之后都标**逗号**，第二部分引语开头字母**小写**。· 若前半部分是**完整句子**：陈述句末标逗号，疑问句末标问号，感叹句末标惊叹号；引用者的话之后**一律标句号**，第二部分引语**大写**字母开头。", "table": {"headers": ["例句", "译文"], "rows": [["«Прости́те, — сказа́л Ко́ля, — вы непра́вильно по́няли мой вопро́с».", "「请原谅，」科利亚说，「您把我的问题理解错了。」"], ["«Мне о́чень нра́вится э́та кни́га, — сказа́л Ви́тя. — Большо́е тебе́ спаси́бо».", "「我很喜欢这本书，」维佳说。「非常感谢你。」"]]}}, {"rule": "**[注] 对话的写法**：对话中，每个人的话都另起一行，**不用引号**，在直接引语前标**破折号**。", "table": {"headers": ["例句", "译文"], "rows": [["— Вы о́чень мно́го ку́рите.", "「您吸烟太多。」"], ["— Почему́ же нельзя́ кури́ть?", "「为什么我不应该吸烟？」"], ["— Куре́ние де́лает жизнь коро́че.", "「吸烟减寿。」"]]}}]}, {"id": "direct-to-indirect", "title": "五、直接引语和间接引语（2）转换方法", "points": ["用间接引语代换直接引语时，**人称代词、物主代词及谓语形式**要从**引用者的角度**作相应的改变。例如：", "　«Где ты потеря́ла ключ от ко́мнаты, На́дя?» — спроси́л Андре́й.", "　→ Андре́й спроси́л На́дю, где она́ потеря́ла ключ от ко́мнаты.（安德烈问娜佳把房间钥匙丢在哪里了。）"], "cases": [{"rule": "**1）直接引语为陈述句**：使用带连接词 **что** 的说明从句来代换。", "table": {"headers": ["直接引语", "间接引语"], "rows": [["Продаве́ц отве́тил: «Мужски́е костю́мы мо́жно купи́ть в э́том магази́не на второ́м этаже́».", "Продаве́ц отве́тил, что мужски́е костю́мы мо́жно купи́ть в э́том магази́не на второ́м этаже́."]]}}, {"rule": "**2）直接引语为疑问句**：· 带疑问词的疑问句 → 用说明从句代换，**疑问词用作关联词**。· 不带疑问词的疑问句 → 用带语气词 **ли** 的说明从句代换，「**疑问中心词 + ли**」置于从句句首。", "table": {"headers": ["直接引语", "间接引语"], "rows": [["Сосе́д спроси́л меня́: «О чём вы хоте́ли рассказа́ть?»", "Сосе́д спра́шивает меня́, о чём я хоте́л рассказа́ть."], ["«Экску́рсия состои́тся?» — спроси́л переводчицу тури́ст.", "Тури́ст спроси́л переводчицу, состои́тся ли экску́рсия."]]}}, {"rule": "**3）直接引语为祈使句**：用带连接词 **чтобы** 的说明从句来代换。", "table": {"headers": ["直接引语", "间接引语"], "rows": [["Де́вочка сказа́ла ма́тери и отцу́: «Жди́те меня́ на Рождество́!»", "Де́вочка сказа́ла ма́тери и отцу́, что́бы они́ жда́ли её на Рождество́."]]}}]}], "quiz": [{"cat": "不定代词", "q": "Расскажи́ ___ о свое́й студе́нческой жи́зни.（讲点儿你在学院生活的事儿吧）", "options": ["что́-нибудь", "что́-то", "ко́е-что", "ничего́"], "answer": 0, "explain": "祈使句中表示「随便什么」，用 -нибудь。"}, {"cat": "不定代词", "q": "Е́сли ___ придёт, позови́те меня́.（要是有人来，就叫我一下）", "options": ["кто́-нибудь", "кто́-то", "ко́е-кто", "никто́"], "answer": 0, "explain": "条件句中说话人不知道是否存在，用 -нибудь。"}, {"cat": "不定代词", "q": "Вы с ним ___ встреча́лись?（您和他什么时候见过面吗？）", "options": ["когда́-нибудь", "когда́-то", "ко́е-когда́", "никогда́"], "answer": 0, "explain": "疑问句中表示「任何时候」，用 -нибудь。"}, {"cat": "不定代词", "q": "Са́ша ждёт ___ у вхо́да.（萨沙在入口处等什么人）", "options": ["кого́-нибудь", "кого́-то", "ко́е-кого́", "никого́"], "answer": 1, "explain": "说话人知道有人，但不知是谁，用 -то。"}, {"cat": "不定代词", "q": "___ кни́га лежи́т на столе́.（不知是谁的书放在桌子上）", "options": ["Чья́-нибудь", "Чья́-то", "Ко́е-чья", "Ничья́"], "answer": 1, "explain": "知道存在但指不出具体是谁，用 -то。"}, {"cat": "不定代词", "q": "Пе́ти нет до́ма: он ___ ушёл.（彼佳没在家，不知上哪儿去了）", "options": ["куда́-нибудь", "куда́-то", "ко́е-куда́", "никуда́"], "answer": 1, "explain": "说话人知道去处存在但不知具体是哪儿，用 -то。"}, {"cat": "不定代词", "q": "-нибудь 与 -то 的核心区别是：", "options": ["-нибудь 不知是否存在；-то 知道存在但说不出具体是哪个", "-то 用于书面语", "-нибудь 只用于过去时", "两者完全一样"], "answer": 0, "explain": "-нибудь 表「任何、随便哪一个」；-то 表「有，但不知是哪一个」。"}, {"cat": "不定代词", "q": "带 -либо 的不定代词与 -нибудь 相比：", "options": ["意义相同，但 -либо 多用于书面语", "意义完全不同", "-либо 只用于口语", "-либо 不能变格"], "answer": 0, "explain": "教材注明：两者意义相同，前者多用于书面语。"}, {"cat": "不定代词", "q": "Ко́е у кого́ я уже́ спра́шивал об э́том. 中前置词为什么放在 ко́е 后面？", "options": ["固定搭配，没有原因", "不定代词与前置词连用时，前置词置于 кое- 与疑问代词之间", "因为 кого́ 是第二格", "因为是口语"], "answer": 1, "explain": "这是带 кое- 的不定代词与前置词连用的规则。"}, {"cat": "不定代词", "q": "Мне ну́жно ___ сходи́ть.（我要到某个地方去一趟）", "options": ["ко́е-куда́", "куда́-нибудь", "куда́-то", "никуда́"], "answer": 0, "explain": "说话人确知存在但因故不明说，用 кое-。"}, {"cat": "引语标点", "q": "直接引语位于引用者的话**之后**时，其前应标：", "options": ["逗号", "冒号", "破折号", "分号"], "answer": 1, "explain": "后置时其前标冒号，引语第一个字母大写。"}, {"cat": "引语标点", "q": "直接引语位于引用者的话**之前**时，两者之间用：", "options": ["冒号", "逗号", "破折号", "引号"], "answer": 2, "explain": "前置时用破折号连接，引用者的话用倒装词序。"}, {"cat": "引语标点", "q": "«Что с тобо́й случи́лось?» 这类疑问句作直接引语时，问号放在：", "options": ["引号外", "引号内", "句末引号之后", "不用标"], "answer": 1, "explain": "疑问句或感叹句的句末标点放在引号内。"}, {"cat": "引语标点", "q": "陈述句作直接引语时，句号放在：", "options": ["引号内", "引号外", "两者都可", "不标"], "answer": 1, "explain": "陈述句句末使用句号，放在引号外。"}, {"cat": "引语标点", "q": "«Прости́те, — сказа́л Ко́ля, — вы непра́вильно по́няли мой вопро́с». 这属于哪种情况？", "options": ["引语在引用者话之后", "引语在引用者话之前", "引用者的话在引语之中，前半部分不是完整句子", "对话体"], "answer": 2, "explain": "引用者的话夹在中间；前半部分不是完整句子，故第二部分引语开头小写。"}, {"cat": "引语标点", "q": "对话中每个人的话应该：", "options": ["用引号括起", "另起一行，不用引号，前面标破折号", "用冒号引出", "连成一段"], "answer": 1, "explain": "这是教材的[注]：对话中每人一句另起一行，不用引号，前标破折号。"}, {"cat": "间接引语", "q": "直接引语为**陈 уко́й, но уже́ не слы́шал слов.（我只看到他向我频频挥手，但已经听不见他说的话了。）", "Он махну́л мне руко́й и ушёл.（他向我挥了一下手就走了。）"]]}}, {"rule": "**2）未完成体表示持续行为**（句中常有 весь 或第四格词组作时间状语）；**完成体常与 за + 第四格结构连用**，表示在一定时间内结束的行为。例如：", "table": {"headers": ["未完成体（持续，没结果）", "完成体（在……时间内完成）"], "rows": [["Анто́н учи́л но́вые слова́ час, но ещё пло́хо зна́ет их.（安东学新单词学了一个小时，但是掌握得还是不好。）", "Анто́н вы́учил но́вые слова́ за час и тепе́рь хорошо́ зна́ет их.（安东用一个小时背会了生词，现在掌握得很好。）"]]}}, {"rule": "**[注]** 一些带前缀 **по-** 的完成体动词可以与表示行为持续意义的第四格名词或词组连用，表示**有限度的持续行为**。例如：", "table": {"headers": ["例句", "译文"], "rows": [["Я про́ждал его́ це́лый час.", "我等了他整整一小时。"], ["Мы поговори́ли не́сколько мину́т.", "我们谈了几分钟。"]]}}, {"rule": "**3）未完成体表示过去进行中的行为；完成体表示在某时已完成的行为。**并列的未完成体动词可表示**同时进行**的多种行为，并列的完成体动词表示**先后完成**的多种行为。试比较：", "table": {"headers": ["句子", "译文"], "rows": [["Когда́ ко мне пришёл Анто́н, я перево́дил текст.", "当安东来到我这儿时，我还在翻译课文。"], ["Когда́ пришёл Анто́н, я перевёл текст.", "当安东来到我这儿时，我已译完了课文。"], ["Ви́ктор переводи́л текст и смотре́л но́вые слова́ в словаре́.", "维克多边翻译课文边在词典上查生词。"], ["Ви́ктор перевёл текст и верну́л дру́гу слова́рь.", "维克多翻译完课文，把词典还给了朋友。"]]}}, {"rule": "**4）未完成体表示过去发生了某种行为，不强调结果；完成体表示已经完成的行为。**例如：", "table": {"headers": ["未完成体（不强调结果）", "完成体（已完成）"], "rows": [["Вчера́ ве́чером он повто́рил но́вые слова́.", "Вчера́ ве́чером он повтори́л но́вые слова́."], ["昨天晚上他复习新单词了。", "昨天晚上他复习完了新单词。"]]}}, {"rule": "**5）疑问句中**：未完成体用于询问**泛指行为是否发生过**；完成体表示**某特指行为是否发生或有无结果**。试比较：", "table": {"headers": ["对话", "译文"], "rows": [["— Не ви́дел ты сего́дня Ни́ну? — Сего́дня её не ви́дел.", "「你今天见到尼娜没有？」「没有，我今天没见到她。」"], ["— Ты уви́дел вчера́ Ни́ну? Ты ведь иска́л её по сро́чному де́лу. — Нет, к сожале́нию, её вчера́ не уви́дел.", "「你昨天见到尼娜了吗？你不是有急事找过她吗？」「没有。很遗憾，我昨天没见到她。」"]]}}, {"rule": "**6）与 не 连用**：未完成体表示**没发生过**的行为；完成体表示行为**没有达到结果**，或**特指的行为没有发生**。试比较：", "table": {"headers": ["例句", "译文"], "rows": [["Вчера́ я не писа́л сочине́ние, а повтори́л но́вые слова́.", "昨天我没写作文，我复习生词了。"], ["Не сочини́л потому́, что у меня́ бы́ло ече́ние", "обще́ние", "испо́льзование"], "answer": 0, "explain": "времяпровожде́ние（разг.）＝времяпрепровожде́ние，指「消磨时间」；развлече́ние 是「娱乐」。"}, {"cat": "词汇·网络", "q": "«父母常常妨碍我们上网» 中「妨碍」用：", "options": ["препя́тствовать", "удивля́ть", "утомля́ть", "заменя́ться"], "answer": 0, "explain": "препя́тствовать / воспрепя́тствовать кому́-чему́（妨碍、阻挠）。"}, {"cat": "词汇·网络", "q": "«在虚拟交际中落落大方、对自己说的话充满信心» 中「落落大方」用：", "options": ["раско́ванность", "уве́ренность", "зави́симость", "эмо́ция"], "answer": 0, "explain": "раско́ванность（无拘无束、落落大方）；уве́ренность 是「信心」。"}, {"cat": "结果取消意义", "q": "「结果取消意义」指：", "options": ["未完成体表示行为结果在说话时刻已经消失", "完成体表示行为没有发生", "未完成体表示将来的行为", "完成体表示经常性行为"], "answer": 0, "explain": "未完成体表示结果取消（做过，但现在已不是那样）；完成体表示结果仍然保持着。"}, {"cat": "结果取消意义", "q": "Вчера́ ко мне ___ роди́тели. Они́ бу́дут жить у меня́ ме́сяц.（父母现在住在我这儿）", "options": ["прие́хали", "приезжа́ли", "приезжа́ют", "прие́хать"], "answer": 0, "explain": "结果保持（人现在还在我这儿），用完成体 прие́хали。"}, {"cat": "结果取消意义", "q": "В про́шлом году́ ко мне ___ роди́тели. Они́ жи́ли у меня́ ме́сяц.（现在人已经走了）", "options": ["приезжа́ли", "прие́хали", "прие́дут", "прие́хать"], "answer": 0, "explain": "结果取消（来过，现在已不在），用未完成体 приезжа́ли。"}, {"cat": "结果取消意义", "q": "窗户现在是关着的，说「我把窗户打开了」应该用：", "options": ["Я откры́л окно́.", "Я открыва́л окно́.", "Я открыва́ю окно́.", "Я откры́ть окно́."], "answer": 0, "explain": "结果仍保持着，用完成体 откры́л。"}, {"cat": "结果取消意义", "q": "「我开过窗户（现在关着）」应该用：", "options": ["Я открыва́л окно́.", "Я откры́л окно́.", "Я открыва́ю окно́.", "Я откры́ть окно́."], "answer": 0, "explain": "结果已消失，用未完成体 открыва́л。"}, {"cat": "结果取消意义", "q": "灯现在亮着，「有人把灯打开了」用：", "options": ["Кто́-то включи́л свет.", "Кто́-то включа́л свет.", "Кто́-то включа́ет свет.", "Кто́-то включи́ть свет."], "answer": 0, "explain": "结果保持（灯亮着），用完成体 включи́л。"}, {"cat": "结果取消意义", "q": "他起过床（现在又躺下了）用：", "options": ["Он встава́л.", "Он встал.", "Он встаёт.", "Он встать."], "answer": 0, "explain": "结果取消：起过床，但现在的状态又不同了，用未完成体 встава́л。"}, {"cat": "结果取消意义", "q": "下列哪一组动 s": ["格", "себя́"], "rows": [["第一格", "—（没有）"], ["第二格", "себя́"], ["第三格", "себе́"], ["第四格", "себя́"], ["第五格", "собо́й"], ["第六格", "(о) себе́"]]}}, {"rule": "**сам 的变格**（与被说明的词一致）：", "table": {"headers": ["格", "阳性", "阴性", "中性", "复数"], "rows": [["第一格", "сам", "сама́", "само́", "са́ми"], ["第二格", "самого́", "само́й", "самого́", "сами́х"], ["第三格", "самому́", "само́й", "самому́", "сами́м"], ["第四格", "самого́ / сам", "саму́ (самоё)", "само́", "сами́х / са́ми"], ["第五格", "сами́м", "само́й", "сами́м", "сами́ми"], ["第六格", "(о) само́м", "(о) само́й", "(о) само́м", "(о) сами́х"]]}}, {"rule": "**сам 的用法**：强调「自己、亲自、本人」，常与动词连用，位置灵活。", "table": {"headers": ["例句", "译文"], "rows": [["На́ша учи́тельница сама́ игра́ла нам на скри́пке.", "我们的女老师亲自为我们拉小提琴。"], ["Он сам винова́т в э́том.", "这件事是他自己的错。"], ["Скажи́ об э́том не мне, а ему́ самому́.", "这件事别跟我说，跟他说。"], ["Пусть де́ти са́ми одева́ются и умыва́ются.", "让孩子们自己穿衣服、洗脸吧。"], ["Я всё сде́лаю сам.", "我全都自己做。"], ["Ты пло́хо зна́ешь самого́ себя́.", "你太不了解你自己了。"], ["Не на́до мно́го говори́ть о само́м себе́.", "不要过多谈论自己。"]]}}, {"rule": "**са́мый 的用法**：① 与表示时间、地点的词连用，表示「紧靠、就在」；② 表示「正是这个、就是那个」（с са́мый / тот са́мый）。", "table": {"headers": ["例句", "译文"], "rows": [["Дождь шёл с са́мого утра́.", "雨从一大早就下起来了。"], ["Ло́дка останови́лась у са́мого бе́рега.", "小船就停在岸边。"], ["Ты пришёл в са́мое вре́мя.", "你来得正是时候。"], ["По э́той са́мой доро́жке мо́жно вы́йти к реке́.", "沿着这条小路就能走到河边。"], ["Э́то та са́мая кни́га, о кото́рой я тебе́ говори́л.", "这就是我跟你说的那本书。"]]}}]}, {"id": "kotory-chey-8", "title": "二、限定从句：который 和 чей", "points": ["**котóрый** 是关系代词，用作关联词引导限定从句。它的**性、数**与主句中的被说明名词一致，**格**由它在从句中的句法作用决定。", "**чей**（谁的）也用作关联词，表示所属关系。它的性、数、格与**从句中被它说明的名词**一致，而**先行词**（主句中被说明的词）是它的所有者。", "试比较：Я был рад уви́деть дру́га, чьи сове́ты мне бы́ли нужны́.（我很高兴见到那位朋友，他的建议对我来说是需要的。）—— чьи 与 сове́ты 一致（复数第一格），而 чьи 指的是 дру́га。"], "cases": [{"rule": "**1）用 который 引导限定从句**：который 的格取决于它在从句中的角色。", "table": {"headers": ["例句", "译文"], "rows": [["Сего́дня ко мне прие́дет друг, ко : "三、形动词短语＝который 从句", "points": ["**形动词短语**（прича́стный оборо́т）可以代替带 **который** 的限定从句。单独一个形动词放在被说明的词**之前**；形动词短语放在被说明的词**之后**，用**逗号**隔开。", "试比较：За столо́м сиди́т ма́льчик, чита́ющий кни́гу. ＝ За столо́м сиди́т ма́льчик, кото́рый чита́ет кни́гу.（桌旁坐着一个正在读书的男孩。）", "换成 который 从句时要注意：который 的**性、数**与被说明的词一致，**格**由它在从句中的作用决定——形动词是**主动**的，所以 который 在从句里作**主语**（第一格）。"], "cases": [{"rule": "**替换对照**（形动词短语 ⇄ который 从句）：", "table": {"headers": ["形动词短语", "который 从句", "译文"], "rows": [["Живу́щие в Москве́ друзья́ ча́сто пи́шут мне.", "Друзья́, кото́рые живу́т в Москве́, ча́сто пи́шут мне.", "住在莫斯科的朋友们常给我写信。"], ["За столо́м сиди́т ма́льчик, чита́ющий кни́гу.", "За столо́м сиди́т ма́льчик, кото́рый чита́ет кни́гу.", "桌旁坐着一个正在读书的男孩。"], ["Мы ви́дим летя́щий самолёт.", "Мы ви́дим самолёт, кото́рый лети́т.", "我们看见一架正在飞的飞机。"]]}}, {"rule": "**注意标点**：形动词短语在被说明的词之后时，前后用逗号隔开；单个形动词在前时不用逗号。", "table": {"headers": ["正确", "说明"], "rows": [["Друзья́, живу́щие в Москве́, ча́сто пи́шут мне.", "短语在中间，前后都有逗号"], ["Мы ви́дим летя́щий самолёт.", "单个形动词在前，不加逗号"]]}}]}], "quiz": [{"cat": "词汇·餐饮", "q": "«菜单» 应说：", "options": ["меню́", "порция", "квитанция", "бульон"], "answer": 0, "explain": "меню́（ср., 不变格）＝菜单；по́рция 是「一份」。"}, {"cat": "词汇·餐饮", "q": "«红菜汤» 应说：", "options": ["борщ", "щи", "уха́", "соля́нка"], "answer": 0, "explain": "борщ（м., 二格 -а́）＝红菜汤；щи 是白菜汤，уха́ 是鱼汤。"}, {"cat": "词汇·餐饮", "q": "«鱼汤» 应说：", "options": ["уха́", "борщ", "щи", "окро́шка"], "answer": 0, "explain": "уха́（ж.）＝鱼汤。"}, {"cat": "词汇·餐饮", "q": "«饺子» 应说：", "options": ["пельме́ни", "котле́та", "шашлы́к", "пирожо́к"], "answer": 0, "explain": "пельме́ни（мн.）＝饺子；单数是 пельме́нь。"}, {"cat": "词汇·餐饮", "q": "«烤羊肉串» 应说：", "options": ["шашлы́к", "котле́та", "би́знес-ланч", "гарни́р"], "answer": 0, "explain": "шашлы́к（м., -а́）＝烤羊肉串、烤肉串。"}, {"cat": "词汇·餐饮", "q": "«（煮肉的）高汤» 应说：", "options": ["бульо́н", "соля́нка", "смета́на", "гарни́р"], "answer": 0, "explain": "бульо́н（м.）＝（煮肉的）高汤。"}, {"cat": "词汇·餐饮", "q": "«一份（多指食物）» 应说：", "options": ["по 词**复数第一人称**的重音相同；带后缀 **-им-** 的重音与该动词**不定式**的重音相同。", "② 以 **-авать** 结尾的动词，构成时去掉 -ть 加 **-ем-** 和词尾 -ый：дава́ть → дава́емый。", "③ 个别**不及物动词**也可构成现在时被动形动词：руководи́ть → руководи́мый, управля́ть → управля́емый。", "④ 有些未完成体及物动词**没有**现在时被动形动词：пить, бить, мыть, петь, шить, лить, брать, ждать, писа́ть。"], "cases": [{"rule": "**构成方法**：未完成体及物动词 → 现在时复数第一人称（мы）→ 加 -ый（-ая, -ое, -ые）。", "table": {"headers": ["不定式", "现在时复数第一人称", "现在时被动形动词"], "rows": [["чита́ть（读）", "чита́ем", "чита́емый (-ая, -ое, -ые)"], ["повторя́ть（复习）", "повторя́ем", "повторя́емый (-ая, -ое, -ые)"], ["люби́ть（爱）", "лю́бим", "люби́мый (-ая, -ое, -ые)"], ["ви́деть（看见）", "ви́дим", "ви́димый (-ая, -ое, -ые)"], ["дава́ть（给）", "даём", "дава́емый (-ая, -ое, -ые)"], ["узнава́ть（认出）", "узнаём", "узнава́емый (-ая, -ое, -ые)"], ["руководи́ть（领导）", "руководи́м", "руководи́мый (-ая, -ое, -ые)"]]}}, {"rule": "**用法**：现在时被动形动词短语可以换成 который 从句；单独使用时放在被说明的词之前。", "table": {"headers": ["例句", "译文"], "rows": [["В э́том журна́ле есть статья́ по рассма́триваемому вопро́су.", "这期杂志上有关于正在研究的这个问题的文章。"], ["Иссле́дуемая учёными пробле́ма тре́бует неме́дленного реше́ния.", "学者们正在研究的问题需要立刻解决。"], ["Пробле́ма, иссле́дуемая учёными, тре́бует неме́дленного реше́ния.", "学者们正在研究的问题需要立刻解决。（短语在后，前后加逗号）"]]}}]}, {"id": "passive-past-10", "title": "二、被动形动词：过去时的构成", "points": ["**过去时被动形动词**一般由**完成体及物动词**构成，主要有三种词尾：**-нный**、**-енный（-ённый）**、**-тый**。", "**1）以 -ать, -ять, -еть 结尾**的动词：去掉 -ть 加 **-нн-** 及词尾 -ый（написа́ть → напи́санный, потеря́ть → поте́рянный, уви́деть → уви́денный）。此类形动词的重音一般在 **-анн-, -янн-, -енн-** 的**前一个音节**上。", "**2）以 -ить, -ти 结尾**的动词：用现在时（或将来时）单数第一人称词干加 **-енн-**（постро́ить → постро́ю → постро́енный）。注意辅音交替：д — жд（победи́ть → побеждённый）、т — ч（встре́тить → встре́ченный）。带后缀 **-ённ-** 的形动词重音在词尾（реши́ть → решённый, перевести́ → переведённый）。", "**3）以 -чь, -сть 结尾**的动词：加 **-енн-（-ённ-）**（привле́чь → привлечённый, укра́сть → укра́денный）。", "**4）以 -нять, -нуть, -ыть 结尾**的动词：去掉 -ть 加 **-т-**（подня́ть → по́днятый, заня́ть → за́нятый, сверну́ть → свёрнутый, закры́ть → закры́тый）；взять → взя́тый, оде́ть → оде́тый, сшить → сши́тый, запере́ть → за́пертый, нача́ть → нача́тый, спеть → спе́тый, уби́ть → уби́тый。"], "cases": [{"rule": "**-нный** 型（-ать, -ять, -еть 结尾，重音在 -анн-/-янн-/-енн- 前一音节）：", "table": {"headers": ["不定式", "过去时", "过去时被动形动词"], "rows": [["написа́ть（写完）", "написа́л", "напи́санный (-ая, -ое, -ые)"], ["потеря́ть（丢失）", "потеря́л", "поте́рянный (-ая, -ое, -ые)"], ["уви́деть（看见）", "уви́дел", "уви́денный (-ая, -ое, -ые)"]]}}, {"rule": "**-енный / -ённый** 型（-ить, -ти 结尾；注意 д—жд、т—ч 交替）：", "table": {"headers": ["不定式", "单数第一人称", "过去时被动形动词"], "rows": [["постро́ить（建成）", "постро́ю", "постро́енный (-ая, -ое, -ые)"], ["вы́учить（学会）", "вы́учу", "вы́ученный (-ая, -ое, -ые)"], ["встре́тить（遇见）", "встре́чу", "встре́ченный (-ая, -ое, -ые)"], ["пове́сить（挂上）", "пове́шу", "пове́шенный (-ая, -ое, -ые)"], ["купи́ть（买）", "куплю́", "ку́пленный (-ая, -ое, -ые)"], ["победи́ть（战胜）", "побежду́", "побеждённый (-ая, -ое, -ые)"], ["освободи́ть（解放）", "освобожу́", "освобождённый (-ая, -ое, -ые)"], ["реши́ть（解决）", "решу́", "решённый (-ая, -ое, -ые)"], ["перевести́（翻译）", "переведу́", "переведённый (-ая, -ое, -ые)"], ["привезти́（运来）", "привезу́", "привезённый (-ая, -ое, -ые)"], ["получи́ть（收到）", "получу́", "полу́ченный (-ая, -ое, -ые)"], ["привле́чь（吸引）", "привлеку́", "привлечённый (-ая, -ое, -ые)"], ["сжечь（烧掉）", "сожгу́", "сожжённый (-ая, -ое, -ые)"], ["укра́сть（偷走）", "украду́", "укра́денный (-ая, -ое, -ые)"]]}}, {"rule": "**-тый** 型（-нять, -нуть, -ыть, -ереть 结尾）：", "table": {"headers": ["不定式", "过去时被动形动词", "译文"], "rows": [["подня́ть", "по́днятый (-ая, -ое, -ые)", "被举起的，被抬高的"], ["заня́ть", "за́нятый (-ая, -ое, -ые)", "被占用的；忙碌的"], ["сверну́ть", "свёрнутый (-ая, -ое, -ые)", "被卷起的；被撤销的"], ["закры́ть", "закры́тый (-ая, -ое, -ые)", "被关闭的"], ["взять", "взя́тый (-ая, -ое, -ые)", "被拿走的"], ["оде́ть", "оде́тый (-ая, -ое, -ые)", "穿着衣服的"], ["сшить", "сши́тый (-ая, -ое, -ые)", "被缝制的"], ["запере́ть", "за́пертый (-ая, -ое, -ые ённый — переведён, переведена́, переведено́, переведены́。", "**3）以 -анный, -тый 结尾**的形动词：со́зданный — со́здан (со́здал), создана́ (создала́), со́здано (со́здало), со́зданы (со́здали)；на́чатый — на́чат (на́чал), начата́ (начала́), на́чато (на́чало), на́чаты (на́чали)。", "短尾被动形动词常用于**被动句**：主语是行为的**客体**，行为者用**第五格**表示。"], "cases": [{"rule": "**短尾形式的构成**：全尾去掉 -ый，按性数加 -а / -о / -ы（阳性零词尾）。", "table": {"headers": ["全尾形式", "阳性", "阴性", "中性", "复数"], "rows": [["закры́тый（被关上的）", "закры́т", "закры́та", "закры́то", "закры́ты"], ["постро́енный（建成的）", "постро́ен", "постро́ена", "постро́ено", "постро́ены"], ["сде́ланный（做完的）", "сде́лан", "сде́лана", "сде́лано", "сде́ланы"], ["полу́ченный（收到的）", "полу́чен", "полу́чена", "полу́чено", "полу́чены"], ["решённый（解决的）", "решён", "решена́", "решено́", "решены́"], ["отпра́вленный（寄出的）", "отпра́влен", "отпра́влена", "отпра́влено", "отпра́влены"], ["переведённый（翻译的）", "переведён", "переведена́", "переведено́", "переведены́"], ["со́зданный（建立的）", "со́здан (со́здал)", "создана́ (создала́)", "со́здано (со́здало)", "со́зданы (со́здали)"], ["на́чатый（开始的）", "на́чат (на́чал)", "начата́ (начала́)", "на́чато (на́чало)", "на́чаты (на́чали)"]]}}, {"rule": "**用法**：短尾被动形动词作谓语，行为者用第五格。", "table": {"headers": ["例句", "译文"], "rows": [["Письмо́ напи́сано.", "信写好了。"], ["Пье́са «Три сестры́» написа́на Че́ховым.", "剧本《三姊妹》是契诃夫写的。"], ["Реше́ние бы́ло пра́вильно.", "决定是正确的。"]]}}]}, {"id": "short-adjective-11", "title": "二、形容词的短尾形式", "points": ["**性质形容词**有全尾和短尾两种形式。短尾形式在句中作**谓语**，按性和数变化：阳性零词尾，阴性 **-а**，中性 **-о**，复数 **-ы**。", "构成时常常发生**元音脱落**（-кий → -ок: бли́зкий — бли́зок）或**重音移动**（бли́зок, близка́, бли́зко, бли́зки）。", "**[注]** 有些形容词短尾形式比较特殊：ста́рший（较年长的）、мла́дший（较年幼的）；**большо́й** 的短尾是 вели́к, велика́, велико́, велики́；**ма́ленький** 的短尾是 мал, мала́, мало́, малы́。", "**[注]** **рад** 和 **до́лжен** 只有短尾形式，没有全尾形式。短尾形式常与 **быть** 连用表示将来或过去：Докла́д бу́дет содержа́телен. Будь споко́ен!"], "cases": [{"rule": "**短尾形式的构成**（注意元音脱落与重音）：", "table": {"headers": ["全尾形式", "阳 ва-：дава́ть → дава́я, встава́ть → встава́я, узнава́ть → узнава́я。", "**[注]** 有些动词**不能**构成未完成体副动词：ждать, писа́ть, спать, пить, бить, петь, ехать；以 **-чь** 结尾的动词（мочь, бере́чь）也不能。"], "cases": [{"rule": "**构成方法**：现在时复数第三人称词干 + -а（ж, ш, ч, щ 及硬辅音后）或 -я。", "table": {"headers": ["不定式", "现在时（они́）", "未完成体副动词", "词尾"], "rows": [["чита́ть（读）", "чита́ют", "чита́я", "-я"], ["стро́ить（建造）", "стро́ят", "стро́я", "-я"], ["нести́（拿）", "несу́т", "неся́", "-я"], ["лежа́ть（躺）", "лежа́т", "лёжа", "-а"], ["слу́шать（听）", "слу́шают", "слу́шая", "-а"], ["крича́ть（喊）", "крича́т", "крича́", "-а"], ["занима́ться（学习）", "занима́ются", "занима́ясь", "-я + -сь"], ["учи́ться（学习）", "у́чатся", "уча́сь", "-а + -сь"], ["дава́ть（给）", "даю́т", "дава́я", "-я（保留 -ва-）"], ["встава́ть（起床）", "встаю́т", "встава́я", "-я（保留 -ва-）"], ["узнава́ть（认出）", "узнаю́т", "узнава́я", "-я（保留 -ва-）"], ["расстава́ться（分手）", "расстаю́тся", "расстава́ясь", "-я + -сь"]]}}, {"rule": "**不能构成未完成体副动词的动词**（教材 [注]）：", "table": {"headers": ["动词", "说明"], "rows": [["ждать, писа́ть, спать, пить, бить, петь, еха́ть", "没有未完成体副动词形式"], ["мочь, бере́чь（以 -чь 结尾）", "没有未完成体副动词形式"]]}}]}, {"id": "deepr-perf-12", "title": "二、完成体副动词的构成", "points": ["**完成体副动词**表示**在主句行为之前已经完成**的行为，由**完成体动词的过去时词干**构成：", "　过去时词干以**元音结尾**时加 **-в**（прочита́л → прочита́в, уви́дел → уви́дев, отдохну́л → отдохну́в）；", "　过去时词干以**辅音结尾**时加 **-ши**（спас → спа́сши, принёс → принёсши, помог → помо́гши）；", "　带 **-ся** 的动词加 **-вшись**（верну́лся → верну́вшись, собра́лся → собра́вшись, увлёкся → увлёкшись）。", "**特殊形式**：прийти́ — придя́, привести́ — приведя́, принести́ — принеся́, проче́сть — прочтя́。", "有的动词有两种形式：услы́шать — услы́шав / услы́ша；окре́пнуть — окре́пнув / окре́пши；запере́ть — запере́в / за́перши。"], "cases": [{"rule": "**构成方法**：过去时词干 + -в（元音后）/ -ши（辅音后）/ -вшись（带 -ся）。", "table": {"headers": ["不定式", "过去时", "完成体副动词", "词尾"], "rows": [["прочита́ть（读完）", "прочита́л", "прочита́в", "-в"], ["уви́деть（看见）", "уви́дел", "уви́дев", "-в"], ["отдохну́ть（休息）", "отдохну́л", "отдохну́в", "-в"], ["спасти́（救出）", "спас", "спа́сши", "-ши"], ["принести́（带来）", "принёс", "принёсши", "-ши"], ["помо́чь（帮助）", "помо́г", "помо́гши", "-ши"], ["верну́ться（回来）", "верну́лся", "верну́вшись", "-вшись"], ["собра́ться（集合）", "собра́лся", "собра́вшись", "-вшись"], ["увле́чься（入迷）", "увлёкся", "увлёкшись", "-шись"], ["прийти́（来到）", "пришёл", "придя́", "-я（特殊）"], ["привести́（领来）", "привёл", "приведя́", "-я（特殊）"], ["принести́（拿来）", "принёс", "принеся́", "-я（特殊）"], ["проче́сть（读完）", "прочёл", "прочтя́", "-я（特殊）"], ["услы́шать（听见）", "услы́шал", "услы́шав / услы́ша", "-в / -а"], ["окре́пнуть（强壮起来）", "окре́п", "окре́пнув / окре́пши", "-в / -ши"], ["запере́ть（锁上）", "за́пер", "запере́в / за́перши", "-в / -ши"]]}}]}, {"id": "deepr-phrase-12", "title": "三、副动词短语的用法", "points": ["**副动词短语**（дееприча́стный оборо́т）在句中作**状语**，表示主句行为的**方式、时间、原因、条件、让步**等。", "副动词或副动词短语通常放在**句首**或**句中**，用**逗号**与主句隔开。", "副动词短语的**行为主体**必须与主句的**主语**一致（同一个主体做两个动作）。", "副动词短语可以换成**并列谓语**或相应的**从句**：Прочита́в статью́, он отда́л журна́л мне. ＝ Он прочита́л статью́ и отда́л журна́л мне. ＝ После того́ как он прочита́л статью́, он отда́л журна́л мне."], "cases": [{"rule": "**副动词短语在句中的用法**（同一个主体、两个动作）：", "table": {"headers": ["例句", "译文", "含义"], "rows": [["Друзья́ шли по у́лице, ве́село разгова́ривая.", "朋友们在街上走着，愉快地交谈着。", "方式（同时）"], ["Ви́тя, не сказа́в ни сло́ва, вы́шел из ко́мнаты.", "维佳一句话也没说就走出了房间。", "方式（先后）"], ["Идя́ домо́й, я встре́тил отца́.", "回家时我遇见了父亲。", "时间"], ["Око́нчив университе́т, он верну́лся на ро́дину.", "大学毕业后，他回到了故乡。", "时间（先后）"], ["Он чита́л, си́дя за столо́м.", "他坐在桌旁读书。", "方式"], ["Пообе́дав, я пошёл гуля́ть.", "吃过午饭，我就去散步了。", "时间（先后）"]]}}, {"rule": "**注意**：副动词短语与主句必须**同一主体**；如果主体不同，就要用从句。", "table": {"headers": ["正确", "说明"], "rows": [["Прочита́в статью́, он отда́л журна́л мне.", "读文章和还杂志都是 он 做的，可以"], ["Когда́ я пришёл домо́й, меня́ встре́тил оте́ц.", "两个主体不同（я / оте́ц），不能用副动词，要用从句"]]}}]}], "quiz": [{"cat": "词汇·节日", "q": "«邀请；请帖» 应说：", "options": ["приглаше́ние", "предложе́ние", "угоще́ние", "пр const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
const LS = 'ru3-progress-v1';

let S = {
  lesson: 0, group: 'all', dir: 'ru2zh', order: [], idx: 0, flipped: false,
  known: {}, wrong: {}, done: 0, right: 0, onlyWrong: false,
  checked: false, lastResult: null, typed: ''
};

function loadSaved(){
  try{ const j = JSON.parse(localStorage.getItem(LS)||'{}');
       S.known = j.known||{}; S.wrong = j.wrong||{}; }catch(e){}
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify({known:S.known, wrong:S.wrong})); }catch(e){} }

function lesson(){ return DATA[S.lesson]; }
function allWords(){ return lesson().words; }
function words(){
  let w = allWords();
  if(S.group!=='all') w = w.filter(x=>x.group===S.group);
  if(S.onlyWrong) w = w.filter(x=>S.wrong[x.ru]);
  return w;
}
function rebuild(shuffle){
  const w = words();
  S.order = w.map((_,i)=>i);
  if(shuffle) for(let i=S.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];}
  resetCheck(); S.idx = 0; S.done = 0; S.right = 0;
  renderCard();
}
function current(){
  const w = words();
  if(!w.length) return null;
  let guard = 0;
  while(guard++ <= w.length){
    if(S.idx >= S.order.length) S.idx = 0;
    const item = w[S.order[S.idx]];
    if(item) return item;
    S.idx++;
  }
  return null;
}
/* ---------- 拼写判定（默写模式） ---------- */
const ACCENT_RE = /[\u0300\u0301\u0304\u0306\u030B]/g;
function stripAccent(s){ return String(s).replace(ACCENT_RE, ''); }
function normStrict(s){
  return stripAccent(s).replace(/[.,;:!?"'«»()\[\]]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
}
function normLoose(s){ return normStrict(s).replace(/ё/g,'е'); }
/* 一个词条可能有多种可接受答案: "разде́ться // раздева́ться"、"парикма́хер, парикма́херша" */
function acceptedAnswers(ru){
  return String(ru).split(/\s*\/\/\s*|\s*,\s*/).map(s=>s.trim()).filter(Boolean);
}
function checkSpelling(input, ru){
  const cands = acceptedAnswers(ru);
  const u = String(input||'').trim();
  if(!u) return { ok:false, empty:true, cands:cands };
  if(cands.some(c => normStrict(c) === normStrict(u))) return { ok:true, exact:true, cands:cands };
  if(cands.some(c => normLoose(c) === normLoose(u))) return { ok:true, exact:false, cands:cands };
  return { ok:false, exact:false, cands:cands };
}
function isTypeMode(){ return S.dir === 'zh2type'; }

function renderCard(){
  const w = current();
  const front = document.getElementById('card-front');
  const sub = document.getElementById('card-sub');
  const ans = document.getElementById('card-answer');
  const typeArea = document.getElementById('type-area');
  const hint = document.getElementById('card-hint');
  const typing = isTypeMode();
  typeArea.style.display = typing ? 'block' : 'none';
  hint.textContent = typing ? '输入俄语后按回车（不用打重音）' : '点击卡片或按空格翻转';
  if(!w){
    front.textContent = '—'; front.className='word';
    sub.textContent = S.onlyWrong ? '错词本是空的 🎉' : '这一范围没有单词';
    ans.style.display='none'; updateStats(); return;
  }
  if(typing){
    front.textContent = w.zh; front.className = 'word zh';
    sub.textContent = w.group + (w.pos? ' · '+w.pos : '');
    const inp = document.getElementById('type-input');
    if(S.checked){
      inp.disabled = false;                    // 不禁用: 保持焦点, 按回车即可进入下一题
      if(typeof inp.focus === 'function') inp.focus();
      const r = S.lastResult || { ok:false };
      ans.style.display = 'block';
      ans.innerHTML = r.ok
        ? '<span style="color:#16a34a;font-weight:600">✅ 正确</span>'
          + (r.exact ? '' : '<span class="note">拼写对了，不过请注意 ё 的写法</span>')
          + '<span class="note">' + esc(w.ru) + (w.note? '　'+esc(w.note) : '') + '</span>'
        : '<span style="color:#dc2626;font-weight:600">❌ 正确写法</span>'
          + '<div style="margin-top:6px;font-size:24px">' + esc(w.ru) + '</div>'
          + '<span class="note">' + esc(w.zh) + (w.note? '　'+esc(w.note) : '') + '</span>';
    }else{
      inp.disabled = false;
      inp.value = S.typed || '';
      ans.style.display = 'none';
      if(typeof inp.focus === 'function') inp.focus();
    }
    updateStats();
    return;
  }
  if(S.dir==='ru2zh'){
    front.textContent = w.ru; front.className = 'word';
    sub.textContent = w.group + (w.pos? ' · '+w.pos : '');
  }else{
    front.textContent = w.zh; front.className = 'word zh';
    sub.textContent = w.group;
  }
  if(S.flipped){
    ans.style.display='block';
    ans.innerHTML = S.dir==='ru2zh'
      ? '<span class="pos">'+esc(w.pos||'')+'</span>'+esc(w.zh)
        + (w.note? '<span class="note">'+esc(w.note)+'</span>':'')
      : '<span class="pos">'+esc(w.pos||'')+'</span>'+esc(w.ru)
        + (w.note? '<span class="note">'+esc(w.note)+'</span>':'');
  }else{
    ans.style.display='none';
  }
  updateStats();
}
function updateStats(){
  const w = words();
  document.getElementById('st-pos').textContent = (w.length? (S.idx+1):0)+'/'+w.length;
  document.getElementById('st-done').textContent = S.done;
  document.getElementById('st-acc').textContent = S.done? Math.round(S.right/S.done*100)+'%' : '—';
  document.getElementById('st-wrong').textContent = Object.keys(S.wrong).length;
}
function resetCheck(){ S.flipped = false; S.checked = false; S.lastResult = null; S.typed = ''; }
function flip(){
  if(!current()) return;
  if(isTypeMode()){ giveUp(); return; }     // 默写模式下点卡片 = 看答案
  S.flipped = !S.flipped; renderCard();
}
function next(){ S.idx++; resetCheck(); if(S.idx>=S.order.length) S.idx=0; renderCard(); }
function prev(){ S.idx = (S.idx-1+S.order.length)%S.order.length; resetCheck(); renderCard(); }
function submitTyping(){
  const w = current(); if(!w || !isTypeMode()) return;
  if(S.checked){ next(); return; }          // 已判定, 再回车就是下一题
  const inp = document.getElementById('type-input');
  const val = String((inp && inp.value) || '').trim();
  if(!val) return;
  const r = checkSpelling(val, w.ru);
  S.checked = true; S.lastResult = r; S.typed = val;
  S.done++; if(r.ok) S.right++;
  if(r.ok){ S.known[w.ru] = true; delete S.wrong[w.ru]; }
  else { S.wrong[w.ru] = true; delete S.known[w.ru]; }
  save(); renderCard(); updateStats();
}
function giveUp(){
  const w = current(); if(!w || S.checked) return;
  S.checked = true; S.lastResult = { ok:false };
  S.done++; S.wrong[w.ru] = true; delete S.known[w.ru];
  save(); renderCard(); updateStats();
}
function mark(ok){
  const w = current(); if(!w) return;
  if(ok){ S.known[w.ru]=true; delete S.wrong[w.ru]; S.right++; }
  else { S.wrong[w.ru]=true; delete S.known[w.ru]; }
  S.done++; save();
  if(S.onlyWrong) rebuild(false); else next();
  updateStats();
}
function speak(){
  const w = current(); if(!w) return;
  try{
    const u = new SpeechSynthesisUtterance(w.ru.replace(/[\u0301]/g,''));
    u.lang='ru-RU'; u.rate=.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){ alert('这台设备的浏览器不支持朗读'); }
}
function renderList(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  const g = document.getElementById('sel-group2').value;
  let w = allWords();
  if(g!=='all') w = w.filter(x=>x.group===g);
  /* 搜索时忽略重音符号, 否则复制来的带重音的词查不到 */
  const qq = stripAccent(q);
  if(qq) w = w.filter(x=> stripAccent(x.ru+' '+x.zh+' '+(x.note||'')).toLowerCase().includes(qq));
  document.getElementById('wordlist').innerHTML = w.map(x=>
    '<li><div class="ru">'+esc(x.ru)+
    (x.pos?'<span class="pos">'+esc(x.pos)+'</span>':'')+
    (x.note?'<span class="note">'+esc(x.note)+'</span>':'')+
    '</div><div class="zh">'+esc(x.zh)+
    '<span class="tag">'+esc(x.group||'')+'</span></div></li>').join('')
    || '<li>没有匹配的词条</li>';
}
function renderGrammar(){
  const L = lesson();
  let h = '<h3 style="margin-top:0">УРОК '+L.lesson+' · '+esc(L.title_ru)+'　<span style="color:#6b7280;font-weight:400">'+esc(L.title_zh)+'</span></h3>';
  h += '<p style="color:#6b7280;font-size:14px">课文：'+L.texts.map(t=>'«'+esc(t.ru)+'»（'+esc(t.zh)+'）').join('　')+'</p>';
  for(const g of L.grammar){
    h += '<h3>'+esc(g.title)+'</h3>';
    (g.points||[]).forEach(p=> h += '<p>'+md(p)+'</p>');
    if(g.name_table){
      h += '<h3 style="font-size:15px;color:#6b7280">'+esc(g.name_table.title)+'（男名 / 女名）</h3>';
      h += '<div class="namegrid">';
      g.name_table.male.forEach(r=> h += '<div>'+esc(r[0])+' <span>'+(r[1]?esc(r[1]):'—')+'</span></div>');
      g.name_table.female.forEach(r=> h += '<div>'+esc(r[0])+' <span>'+(r[1]?esc(r[1]):'—')+'</span></div>');
      h += '</div>';
    }
    (g.cases||[]).forEach(c=>{
      h += '<div class="rule">'+md(c.rule)+'</div>';
      if(c.table){
        h += '<table><tr>'+c.table.headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>';
        c.table.rows.forEach(r=> h += '<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>');
        h += '</table>';
      }
    });
  }
  h += '<div class="note-src">词条提取自教材课内生词表 <i>СЛОВА И СЛОВОСОЧЕТАНИЯ</i>（PDF 第 '
     + L.source.glossary_pages_pdf.join('、') + ' 页），由扫描件 OCR 后人工逐条校对，'
     + '重音按俄语规范标注。语法表依据教材语法板块整理。建议对照纸质教材抽查。</div>';
  document.getElementById('grambody').innerHTML = h;
}
/* ==================== 语法练习 ==================== */
let Q = { cat:'all', order:[], idx:0, done:0, right:0, wrongSet:[], tempPool:null, answered:false, current:null };

function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* 从变格表自动出题: 同列其他格的形式作为干扰项 */
function caseQuestions(L){
  const out = [];
  const clean = s => String(s).replace(/^[\u043Eo]\s+/, '');   // 兼容西里尔 о 与拉丁 o
  for(const g of (L.grammar||[])){
    /* 按语法板块标题分类: 代词变格表不能叫"姓名变格" */
    const cat = /代词/.test(String(g.title||'')) ? '代词变格' : '姓名变格';
    for(const c of (g.cases||[])){
      const t = c.table;
      if(!t || !t.headers || !t.rows || t.headers.length < 3) continue;
      if(!t.rows.every(r => /格/.test(String(r[0] || '')))) continue;   // 只把"变格表"用于自动出题
      for(let ci=1; ci<t.headers.length; ci++){
        for(let ri=0; ri<t.rows.length; ri++){
          const row = t.rows[ri];
          if(!row || row.length <= ci) continue;
          const correct = clean(row[ci]);
          const rest = t.rows.map(r => clean(r[ci])).filter(v => v && v !== correct);
          const uniq = [...new Set(rest)];
          if(uniq.length < 3) continue;
          shuffleArr(uniq);
          const opts = shuffleArr([correct, ...uniq.slice(0,3)]);
          out.push({ cat: cat, q: t.headers[ci] + ' 的「' + row[0] + '」形式是？',
                     options: opts, answer: opts.indexOf(correct),
                     explain: String(c.rule||'').replace(/\*\*/g,'') });
        }
      }
    }
  }
  return out;
}
/* 题库必须缓存: 生成过程会打乱选项, 若每次调用都重新生成,
   渲染时的答案下标和判定时的答案下标就会对不上 -> 点对了却判错 */
let POOL_CACHE = { key:null, pool:null };
function quizPool(){
  const L = lesson();
  const key = String(S.lesson);
  if(POOL_CACHE.key === key && POOL_CACHE.pool) return POOL_CACHE.pool;
  const manual = (L.quiz||[]).map(x => ({ cat:x.cat||'语法', q:x.q,
      options:x.options.slice(), answer:x.answer, explain:x.explain }));
  POOL_CACHE = { key:key, pool: caseQuestions(L).concat(manual) };
  return POOL_CACHE.pool;
}
/* 重新打乱选项时必须同步答案下标; 选项互不相同时 indexOf 才安全 */
function reshuffleOptions(q){
  if(!q || !q.options || new Set(q.options).size !== q.options.length) return;
  const correct = q.options[q.answer];
  shuffleArr(q.options);
  const ni = q.options.indexOf(correct);
  if(ni >= 0) q.answer = ni;
}
function filteredQuiz(){
  if(Q.tempPool) return Q.tempPool;   // 重做错题时不受类型筛选限制
  const pool = quizPool();
  return Q.cat === 'all' ? pool : pool.filter(x => x.cat === Q.cat);
}
function renderQuiz(){
  const pool = quizPool();
  const cats = ['all', ...new Set(pool.map(q=>q.cat))];
  const el = document.getElementById('quizbody');
  el.innerHTML =
    '<div class="bar"><label>类型</label><select id="quiz-cat">'
    + cats.map(c=>'<option value="'+esc(c)+'"'+(c===Q.cat?' selected':'')+'>'+(c==='all'?'全部':esc(c))+'</option>').join('')
    + '</select><span class="stats" style="margin:0">'
    + '<span>已答 <b id="q-done">'+Q.done+'</b></span>'
    + '<span>正确率 <b id="q-acc">'+(Q.done?Math.round(Q.right/Q.done*100)+'%':'—')+'</b></span>'
    + '<span>题库 <b>'+pool.length+'</b> 题</span></span></div>'
    + (Q.tempPool ? '<div class="qfb ok" style="margin-bottom:12px">正在重做错题（'+Q.tempPool.length+' 道）'
        + '<button id="q-back" style="margin-left:10px;border:1px solid #a7f3d0;background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;font-family:inherit">返回全部题库</button></div>' : '')
    + '<div class="qbox"><div class="qtext" id="q-text">—</div><div class="qmeta" id="q-meta"></div></div>'
    + '<div class="options" id="q-options"></div><div id="q-fb"></div>'
    + '<div class="actions"><button class="ghost" id="q-next">下一题</button>'
    + '<button class="ghost" id="q-retry">重做错题</button>'
    + '<button class="ghost" id="q-reset">重置统计</button></div>';
  document.getElementById('quiz-cat').onchange = e => { Q.cat = e.target.value; Q.tempPool = null; rebuildQuiz(true); };
  document.getElementById('q-next').onclick = nextQuiz;
  document.getElementById('q-retry').onclick = retryWrong;
  document.getElementById('q-reset').onclick = () => { Q.done=0; Q.right=0; Q.wrongSet=[]; Q.tempPool=null; rebuildQuiz(true); };
  const qback = document.getElementById('q-back');
  if(qback) qback.onclick = () => { Q.tempPool = null; rebuildQuiz(true); };
  rebuildQuiz(true);
}
function rebuildQuiz(reset){
  const list = filteredQuiz();
  list.forEach(reshuffleOptions);
  Q.order = shuffleArr(list.map((_,i)=>i));
  if(reset){ Q.idx = 0; }
  Q.answered = false;
  showQuiz();
}
function showQuiz(){
  const list = filteredQuiz();
  const box = document.getElementById('q-options');
  if(!list.length){ document.getElementById('q-text').textContent = '没有题目'; box.innerHTML=''; document.getElementById('q-fb').innerHTML=''; return; }
  const q = list[Q.order[Q.idx % Q.order.length]];
  Q.current = q;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('q-meta').textContent = q.cat + '　第 ' + ((Q.idx % Q.order.length)+1) + ' / ' + list.length + ' 题';
  box.innerHTML = q.options.map((o,i)=>'<button data-i="'+i+'">'+esc(o)+'</button>').join('');
  [...box.querySelectorAll('button')].forEach(b => { b.onclick = () => answerQuiz(+b.dataset.i); });
  document.getElementById('q-fb').innerHTML = '';
  Q.answered = false;
}
function answerQuiz(i){
  if(Q.answered) return;
  const q = Q.current;          // 必须用渲染时那一道, 不能重新生成题库
  if(!q) return;
  Q.answered = true;
  const btns = [...document.getElementById('q-options').querySelectorAll('button')];
  btns.forEach((b,bi)=>{ b.disabled = true;
    if(bi===q.answer) b.classList.add('right');
    else if(bi===i) b.classList.add('wrong'); });
  const ok = (i === q.answer);
  Q.done++; if(ok) Q.right++; else Q.wrongSet.push(q);
  document.getElementById('q-fb').innerHTML = '<div class="qfb '+(ok?'ok':'no')+'">'
    + (ok ? '✅ 正确' : '❌ 答错了，正确答案是 ' + esc(q.options[q.answer]))
    + (q.explain ? '<br>' + esc(q.explain) : '') + '</div>';
  const d = document.getElementById('q-done'), a = document.getElementById('q-acc');
  if(d) d.textContent = Q.done;
  if(a) a.textContent = Q.done ? Math.round(Q.right/Q.done*100)+'%' : '—';
}
function nextQuiz(){
  const list = filteredQuiz();
  if(!list.length) return;
  if(Q.idx+1 >= list.length){ shuffleArr(Q.order); Q.idx = 0; } else Q.idx++;
  showQuiz();
}
function retryWrong(){
  if(!Q.wrongSet.length){ alert('还没有答错的题'); return; }
  Q.tempPool = Q.wrongSet.slice();
  Q.wrongSet = [];
  rebuildQuiz(true);
}
function setGmode(m){
  document.getElementById('gm-ref').classList.toggle('on', m==='ref');
  document.getElementById('gm-quiz').classList.toggle('on', m==='quiz');
  document.getElementById('grambody').style.display = (m==='ref') ? '' : 'none';
  document.getElementById('quizbody').style.display = (m==='quiz') ? '' : 'none';
  if(m==='quiz') renderQuiz();
}

function initTabs(){
  const map = {cards:'panel-cards', list:'panel-list', gram:'panel-gram'};
  Object.keys(map).forEach(k=>{
    document.getElementById('tab-'+k).onclick = ()=>{
      Object.keys(map).forEach(k2=>{
        document.getElementById('tab-'+k2).classList.toggle('on', k2===k);
        document.getElementById(map[k2]).classList.toggle('on', k2===k);
      });
      if(k==='list') renderList();
      if(k==='gram') renderGrammar();
    };
  });
}
function init(){
  loadSaved();
  const sl = document.getElementById('sel-lesson');
  sl.innerHTML = DATA.map((l,i)=>'<option value="'+i+'">第 '+l.lesson+' 课 · '+esc(l.title_zh)+'</option>').join('');
  const groups = ['all'].concat([...new Set(allWords().map(w=>w.group))]);
  const gopt = groups.map(g=>'<option value="'+esc(g)+'">'+(g==='all'?'全部':esc(g))+'</option>').join('');
  document.getElementById('sel-group').innerHTML = gopt;
  document.getElementById('sel-group2').innerHTML = gopt;
  document.getElementById('booktitle').textContent = '第 '+lesson().lesson+' 课';

  sl.onchange = e=>{ S.lesson = +e.target.value; S.group='all'; S.onlyWrong=false;
      const groups2 = ['all'].concat([...new Set(allWords().map(w=>w.group))]);
      const o2 = groups2.map(g=>'<option value="'+esc(g)+'">'+(g==='all'?'全部':esc(g))+'</option>').join('');
      document.getElementById('sel-group').innerHTML=o2;
      document.getElementById('sel-group2').innerHTML=o2;
      document.getElementById('booktitle').textContent = '第 '+lesson().lesson+' 课';
      rebuild(false); renderList(); renderGrammar(); };
  document.getElementById('sel-group').onchange = e=>{ S.group=e.target.value; rebuild(false); };
  document.getElementById('sel-dir').onchange = e=>{ S.dir=e.target.value; resetCheck(); renderCard(); };
  document.getElementById('type-input').onkeydown = e=>{
    if(e.key === 'Enter'){ e.preventDefault(); submitTyping(); }
  };
  document.getElementById('btn-shuffle').onclick = ()=> rebuild(true);
  document.getElementById('btn-wrong').onclick = e=>{
      S.onlyWrong = !S.onlyWrong;
      e.target.textContent = S.onlyWrong? '背全部' : '只背错词';
      e.target.style.background = S.onlyWrong? '#eef2ff':'#fff';
      rebuild(false);
  };
  document.getElementById('card').onclick = flip;
  document.getElementById('btn-speak').onclick = e=>{ e.stopPropagation(); speak(); };
  document.getElementById('btn-good').onclick = ()=>{
    if(isTypeMode()){ S.checked ? next() : submitTyping(); } else mark(true);
  };
  document.getElementById('btn-bad').onclick = ()=>{
    if(isTypeMode()) giveUp(); else mark(false);
  };
  document.getElementById('btn-prev').onclick = prev;
  document.getElementById('btn-reset').onclick = ()=>{
      if(confirm('清空认识/不认识的记录？')){ S.known={}; S.wrong={}; save(); rebuild(false); }
  };
  document.getElementById('q').oninput = renderList;
  document.getElementById('sel-group2').onchange = renderList;
  document.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    if(e.code==='Space'){ e.preventDefault(); flip(); }
    else if(e.key==='ArrowRight') next();
    else if(e.key==='ArrowLeft') prev();
    else if(e.key==='1') mark(false);
    else if(e.key==='2') mark(true);
    else if(e.key==='r') speak();
  });
  document.getElementById('gm-ref').onclick = ()=> setGmode('ref');
  document.getElementById('gm-quiz').onclick = ()=> setGmode('quiz');
  setGmode('ref');
  initTabs(); rebuild(false); renderList(); renderGrammar();
}
init();
</script>
